name: Portable tests and mock evidence (no GUI acceptance)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: Python 3.13 / ${{ matrix.os }} / no native GUI
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.0'
      - name: Fetch hash-verified reviewed wheels (not redistributed)
        run: python tools/fetch_wheels.py
      - name: Install Windows dependency lock
        if: runner.os == 'Windows'
        run: python -m pip install --no-index --find-links vendor/wheels --require-hashes -r requirements-windows.lock
      - name: Install reviewed build wheel on Linux (mock backend only)
        if: runner.os == 'Linux'
        run: python -m pip install --no-index --no-deps vendor/wheels/setuptools-84.0.0-py3-none-any.whl
      - name: Install source package without resolving new dependencies
        run: python -m pip install --no-build-isolation --no-deps .
      - name: Full existing suite, Unicode, CLI exits and mock bundle verification
        run: |
          python tools/verify.py
          $verifyExit = $LASTEXITCODE
          if ($verifyExit -ne 0) {
            Get-ChildItem -Path runs/verification-*/*.log -File | ForEach-Object {
              Write-Output "Verification log: $($_.Name)"
              Get-Content -LiteralPath $_.FullName
            }
          }
          exit $verifyExit
      - name: Enforce expected test count and gate scope
        run: |
          python -c "import json,pathlib; s=[json.loads(p.read_text(encoding='utf8')) for p in pathlib.Path('runs').glob('verification-*/summary.json')]; assert len(s)==1, s; assert s[0]['test_count']==41 and s[0]['status']=='PASS', s; print('41 tests and mock CLI/evidence PASS; native GUI acceptance NOT RUN in CI')"
