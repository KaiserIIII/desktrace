[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "desktrace"
version = "0.1.0"
description = "Local-first Windows Desktop Regression and Replay Lab"
requires-python = ">=3.13"
readme = "README.md"
license = "MIT"
authors = [{name = "KaiserIIII"}]
dependencies = [
  "pywinauto==0.6.9; sys_platform == 'win32'",
  "comtypes==1.4.17; sys_platform == 'win32'",
  "pywin32==312; sys_platform == 'win32'",
  "six==1.17.0; sys_platform == 'win32'",
]

[project.scripts]
desktrace = "desktrace.cli:main"

[tool.setuptools.packages.find]
include = ["desktrace*"]
